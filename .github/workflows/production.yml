name: Production Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Unit Tests
        run: npm test -- --run

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      # Configure Required reviewers in the GitHub production Environment.
      # The repository intentionally does not auto-deploy to production here.
    steps:
      - name: Production approval gate
        run: echo "Validation passed. Production deployment requires the configured environment approval and deployment integration."
