name: Quality Gate

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validacao completa
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitarios
        run: npm test

      - name: Cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Banco e RLS
        run: |
          npx supabase start
          npm run test:db

      - name: Validar Edge Functions
        run: npm run check:functions

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

      - name: Auditoria de dependencias
        run: npm run security:dependencies

      - name: Encerrar Supabase local
        if: always()
        run: npx supabase stop --no-backup || true
