name: Sincronizar typings React

on:
  push:
    branches:
      - melhoria/frontend-lgpd-resiliencia-20261001

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: melhoria/frontend-lgpd-resiliencia-20261001

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Sincronizar package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Validar dependencias
        run: npm audit --audit-level=moderate

      - name: Commitar lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile ja esta atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(dependencias): adicionar typings oficiais do react"
          git push origin HEAD:melhoria/frontend-lgpd-resiliencia-20261001
